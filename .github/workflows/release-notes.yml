name: Update release notes

# Generates the changelog of a published release again (scripts/changelog.py and notes/), without a new build:
# the release notes keep their files table, the in-app changelog of the update info (R2 and updates/*.json)
# is replaced if the update info is still the one of that release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: latest release)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Title of the releases, as in release.yml
  APP_TITLE: YT Music Morphe
  # The Morphe changelog of the Morphe version RLX Patches is based on
  PATCHES_REPO: MorpheApp/morphe-patches
  DL_BASE_URL: ${{ vars.DL_BASE_URL }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  R2_PREFIX: music/

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          PATCHES_VER=$(sed -n 's/^v[^-]*-\(rlx[^-]*-\)\{0,1\}p\(.*\)-b[0-9]*$/\2/p' <<< "$TAG")
          [ -n "$PATCHES_VER" ] || { echo "::error::Not a release tag of the mod: $TAG"; exit 1; }
          echo "Release $TAG, patches $PATCHES_VER"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "PATCHES_VER=$PATCHES_VER" >> "$GITHUB_ENV"

      - name: Checkout patches
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PATCHES_REPO }}
          ref: v${{ env.PATCHES_VER }}
          path: patches-src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Generate changelog
        run: |
          # Patches versions released before this release (as in the release workflow, where this
          # release did not exist yet)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -vxF "$TAG" \
            | sed -n 's/^v[^-]*-\(rlx[^-]*-\)\{0,1\}p\(.*\)-b[0-9]*$/\2/p' > "$RUNNER_TEMP/released.txt" || true
          python3 -I scripts/changelog.py patches-src/CHANGELOG.md "$PATCHES_VER" \
            "$RUNNER_TEMP/changes.md" "$RUNNER_TEMP/changes.txt" \
            --mod-features notes/mod-features.md \
            --extra-features notes/extra-features.md --released "$RUNNER_TEMP/released.txt" \
            --skipped-features notes/skipped-features.md
          cat "$RUNNER_TEMP/changes.txt"

      - name: Update release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r' > "$RUNNER_TEMP/body.md"
          # The files table of the release stays as it is
          grep -q '^## 📦 Files' "$RUNNER_TEMP/body.md" || { echo "::error::No files table in the release notes of $TAG"; exit 1; }
          {
            cat "$RUNNER_TEMP/changes.md"
            echo
            # The line on the RLX Patches version the release was built with stays too, below the changes
            if grep -q '^Built with ' "$RUNNER_TEMP/body.md"; then
              grep -m1 '^Built with ' "$RUNNER_TEMP/body.md"
              echo
            fi
            # Turkish and Russian notes (changelog/<language>.md of this version), collapsed
            python3 -I scripts/translations.py "$PATCHES_VER"
            echo
            # The files table, without the package column of older releases
            sed -n '/^## 📦 Files/,$p' "$RUNNER_TEMP/body.md" | python3 -c '
          import sys
          lines = sys.stdin.read().splitlines()
          drop = None
          for i, line in enumerate(lines):
              cells = line.split("|")
              names = [cell.strip() for cell in cells]
              if drop is None and line.startswith("|") and "Package" in names:
                  drop = names.index("Package")
              if drop is not None and line.startswith("|") and len(cells) > drop:
                  del cells[drop]
                  lines[i] = "|".join(cells)
          print("\n".join(lines))
          '
          } > "$RUNNER_TEMP/notes.md"
          # The title as the release workflow writes it: "<app> v<app version> · RLX Patches <RLX version>"
          YT_VER=$(sed -n 's/^v\([^-]*\)-.*/\1/p' <<< "$TAG")
          RLX_VER=$(sed -n 's/^v[^-]*-rlx\([^-]*\)-p.*/\1/p' <<< "$TAG")
          if [ -n "$RLX_VER" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md" \
              --title "$APP_TITLE v$YT_VER · RLX Patches $RLX_VER"
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Update in-app changelog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Same fields as the release workflow: English from Morphe, other languages from changelog/<language>.md
          # of this version (others kept)
          set_changelog() {
            jq --rawfile text "$RUNNER_TEMP/changes.txt" \
              '.changelog = ($text | rtrimstr("\n")) | .changelogs.en = ($text | rtrimstr("\n"))' "$1" > "$1.new"
            mv "$1.new" "$1"
            for lang_file in changelog/*.md; do
              [ -f "$lang_file" ] || continue
              [ "$(head -n1 "$lang_file" | tr -d '[:space:]')" = "<!--${PATCHES_VER}-->" ] || continue
              jq --arg lang "$(basename "$lang_file" .md)" --arg text "$(tail -n +2 "$lang_file")" \
                '.changelogs[$lang] = $text' "$1" > "$1.new"
              mv "$1.new" "$1"
            done
          }
          # The stable files exist only after the first build on a stable Morphe version
          for id in apple morphe apple-stable morphe-stable; do
            if [ -n "$DL_BASE_URL" ] && [ -n "$R2_ACCOUNT_ID" ]; then
              s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }
              f="$RUNNER_TEMP/$id.json"
              if ! s3 cp "s3://$R2_BUCKET/${R2_PREFIX}updates/$id.json" "$f" --only-show-errors 2>/dev/null; then
                echo "::notice::${R2_PREFIX}updates/$id.json not found"
              elif [ "$(jq -r .tag "$f")" = "$TAG" ]; then
                set_changelog "$f"
                s3 cp "$f" "s3://$R2_BUCKET/${R2_PREFIX}updates/$id.json" \
                  --content-type "application/json; charset=utf-8" --cache-control no-cache --only-show-errors
                echo "Updated ${R2_PREFIX}updates/$id.json"
              else
                echo "::notice::${R2_PREFIX}updates/$id.json is for another release, not changed"
              fi
            fi
            if [ -f "updates/$id.json" ] && [ "$(jq -r .tag "updates/$id.json")" = "$TAG" ]; then
              set_changelog "updates/$id.json"
            fi
          done
          if ! git diff --quiet updates; then
            git config user.name "RAMiK4"
            git config user.email "60112744+RAMiK4@users.noreply.github.com"
            git add updates
            git commit -m "Changelog of $TAG"
            git pull --rebase -q
            git push
          fi
